<style>
#vfm{box-sizing:border-box;--bg:#f4f6fa;--card:#fff;--tx:#0b2f5e;--mut:#5a6575;--bd:#d5dbe6;--ac:#f58220;--gr:#006a4e;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans','Hind Siliguri',system-ui,sans-serif;padding:16px;border-radius:14px;line-height:1.4}
#vfm *{box-sizing:border-box}
#vfm .wrap{max-width:1000px;margin:0 auto;display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:820px){#vfm .wrap{grid-template-columns:340px 1fr;align-items:start}}
#vfm .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
#vfm h1{font-size:19px;margin:0 0 4px;color:var(--tx)}#vfm p.s{margin:0 0 14px;color:var(--mut);font-size:13px}
#vfm label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:var(--tx)}
#vfm input[type=text]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
#vfm input[type=file]{width:100%;font-size:13px;color:var(--mut)}#vfm input[type=range]{width:100%}
#vfm button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#0b2f5e;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}
#vfm canvas{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--bd);touch-action:none;cursor:grab}
#vfm .hint{font-size:12px;color:var(--mut);margin-top:8px;text-align:center}#vfm #vfm_msg{font-size:13px;margin-top:10px;color:var(--gr)}
</style>
<div id="vfm"><div class="wrap">
<div class="card"><h1>My Voice for Volunteers</h1><p class="s">আপনার তথ্য দিয়ে নিজের ফ্রেম তৈরি করুন</p>
